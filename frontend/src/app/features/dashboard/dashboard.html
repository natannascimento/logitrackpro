@if (dashboard(); as metricas) {
  <div class="dashboard">
    <header class="dashboard__header">
      <h1 class="font-display dashboard__title">Dashboard</h1>
      <p class="dashboard__subtitle">Visão geral da frota</p>
    </header>

    <mat-form-field class="dashboard__filtro" subscriptSizing="dynamic">
      <mat-label>Filtrar por veículo</mat-label>
      <mat-select (selectionChange)="filtrarPorVeiculo($event.value)">
        <mat-option [value]="null">Todos os veículos</mat-option>
        @for (veiculo of veiculos(); track veiculo.id) {
          <mat-option [value]="veiculo.id">{{ veiculo.placa }} — {{ veiculo.modelo }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <div class="dashboard__kpis">
      <app-kpi-card titulo="Total de KM percorrido" [valor]="(metricas.totalKmPercorrido | number: '1.2-2') + ' km'" />
      <app-kpi-card
        titulo="Projeção financeira do mês"
        [valor]="(metricas.projecaoFinanceiraMesCorrente | currency: 'BRL') ?? ''"
      />
      <app-ranking-utilizacao [ranking]="metricas.rankingUtilizacao" />
    </div>

    <div class="panel">
      <span class="panel__titulo">Volume por categoria</span>
      <div class="overflow-x-auto">
        <table mat-table [dataSource]="metricas.volumePorCategoria" class="w-full">
          <ng-container matColumnDef="categoria">
            <th mat-header-cell *matHeaderCellDef>Categoria</th>
            <td mat-cell *matCellDef="let item">
              <span
                class="chip"
                [class.chip--mint]="item.categoria === 'LEVE'"
                [class.chip--amber]="item.categoria === 'PESADO'"
              >
                {{ item.categoria }}
              </span>
            </td>
          </ng-container>

          <ng-container matColumnDef="quantidade">
            <th mat-header-cell *matHeaderCellDef>Quantidade de viagens</th>
            <td mat-cell *matCellDef="let item" class="font-tabular">{{ item.quantidade }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="colunasVolumePorCategoria"></tr>
          <tr mat-row *matRowDef="let row; columns: colunasVolumePorCategoria"></tr>
        </table>
      </div>
    </div>

    <app-cronograma-manutencao [manutencoes]="metricas.cronogramaManutencoes" />
  </div>
}
