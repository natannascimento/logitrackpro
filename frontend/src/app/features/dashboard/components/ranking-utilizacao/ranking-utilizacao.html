<div class="kpi-card">
  <span class="kpi-card__titulo">Ranking de utilização</span>
  @if (ranking(); as veiculo) {
    <span class="kpi-card__valor font-tabular">{{ veiculo.placa }}</span>
    <span class="ranking-utilizacao__detalhe">{{ veiculo.modelo }} · {{ veiculo.totalKm }} km</span>
  } @else {
    <span class="ranking-utilizacao__detalhe">Nenhuma viagem registrada ainda.</span>
  }
</div>
