<div class="overflow-x-auto">
  <table mat-table [dataSource]="manutencoes()" class="w-full">
    <ng-container matColumnDef="veiculo">
      <th mat-header-cell *matHeaderCellDef>Veículo</th>
      <td mat-cell *matCellDef="let manutencao">{{ manutencao.veiculo.placa }} — {{ manutencao.veiculo.modelo }}</td>
    </ng-container>

    <ng-container matColumnDef="tipoServico">
      <th mat-header-cell *matHeaderCellDef>Tipo de serviço</th>
      <td mat-cell *matCellDef="let manutencao">{{ manutencao.tipoServico }}</td>
    </ng-container>

    <ng-container matColumnDef="dataInicio">
      <th mat-header-cell *matHeaderCellDef>Data de início</th>
      <td mat-cell *matCellDef="let manutencao">{{ manutencao.dataInicio | date: 'dd/MM/yyyy' }}</td>
    </ng-container>

    <ng-container matColumnDef="custoEstimado">
      <th mat-header-cell *matHeaderCellDef>Custo estimado</th>
      <td mat-cell *matCellDef="let manutencao">{{ manutencao.custoEstimado | currency: 'BRL' }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let manutencao">{{ manutencao.status }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunas"></tr>
  </table>
</div>
