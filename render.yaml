services:
  - type: web
    name: logitrackpro
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: logitrackpro-db
          property: connectionString
      - key: PORT
        value: 8080
      - key: CORS_ALLOWED_ORIGINS
        value: https://logitrackpro.vercel.app

databases:
  - name: logitrackpro-db
    plan: free
    databaseName: logitrackpro
    user: logitrackpro
