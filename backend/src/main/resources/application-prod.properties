spring.datasource.url=${DATABASE_URL}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${spring.flyway.url:${spring.datasource.url}}
spring.flyway.user=${spring.flyway.user:${spring.datasource.username:}}
spring.flyway.password=${spring.flyway.password:${spring.datasource.password:}}

server.port=${PORT:8080}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://logitrackpro-henna.vercel.app}
