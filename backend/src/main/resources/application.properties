spring.application.name=logitrackpro

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logitrackpro}
spring.datasource.username=${DB_USER:logitrackpro}
spring.datasource.password=${DB_PASSWORD:logitrackpro}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${PORT:8080}
